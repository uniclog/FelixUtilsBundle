name: ankey${NUM}

services:
  ankey${NUM}:
    container_name: ankey${NUM}
    build:
      context: ./docker
      dockerfile: Dockerfile-ankey
    # volumes:
    #   - "./ankey:/opt/ankey"
    ports:
      - "${PORT_HTTP}:8080"
      - "${PORT_DEBUG}:5005"
      - "${PORT_JMX}:9010"
    environment:
      ANKEYIDM_OPTS: "-Xmx1G -Xms1G -Xverify:none -XX:+AggressiveOpts -Djava.net.preferIPv4Stack=true -XX:+UseG1GC"
      LOGGING_CONFIG: "-Dlogback.configurationFile=/opt/ankey/logger/logback.xml"
      ANKEYIDM_ELASTIC_HOST: opensearch${NUM}
      ANKEYIDM_ELASTIC_PORT: 9200
      ANKEYIDM_PG_URL: postgres${NUM}:5432
      ANKEYIDM_KAFKA_HOST: kafka${NUM}:9092
      ANKEYIDM_BPMN_HOST: ankey-bpmn${NUM}:8081
      HARDWARE_ID: teamcity
      JPDA_SUSPEND: n
    depends_on:
      opensearch${NUM}:
        condition: service_started
      postgres${NUM}:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "--header", "Accept: application/json", "--header", "X-Ankey-Username: ankey", "--header", "X-Ankey-Password: ankey", "http://localhost:8080/ankey/info/login" ]
      interval: 1m
      timeout: 30s
      retries: 10
      start_period: 2m
    networks:
      - ankey-network

  postgres${NUM}:
    container_name: postgres${NUM}
    build:
      context: ./docker
      dockerfile: Dockerfile-postgres
    ports:
      - "${PORT_POSTGRES}:5432"
    environment:
      POSTGRES_PASSWORD: ankey
      POSTGRES_USER: ankey
      POSTGRES_DB: ankey
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "ankey" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ankey-network
      
  kafka${NUM}:
    container_name: kafka${NUM}
    build:
      context: ./docker
      dockerfile: Dockerfile-kafka
    ports:
      - "${PORT_KAFKA}:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka${NUM}:9092
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=k5M6oOZeRceoyi1vEm4vSg
    networks:
      - ankey-network

  opensearch${NUM}:
    container_name: opensearch${NUM}
    build:
      context: ./docker
      dockerfile: Dockerfile-opensearch
    ports:
      - "${PORT_OPENSEARCH}:9200"
      - "${PORT_OPENSEARCH_2}:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - ankey-network

networks:
  ankey-network:
    driver: bridge
  ### PostgreSQL
  postgres${NUM}:
    container_name: postgres${NUM}
    build:
      context: ./docker
      dockerfile: Dockerfile-postgres
    volumes:
      - ./ankey/db/postgresql/scripts/aftercreateuser.sql:/docker-entrypoint-initdb.d/aftercreateuser.sql
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "${PORT_POSTGRES}:5432"
    environment:
      POSTGRES_PASSWORD: ankey
      POSTGRES_USER: ankey
      POSTGRES_DB: ankey
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "ankey" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ankey-network